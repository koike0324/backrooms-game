<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Backrooms Escape</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      touch-action: none;
      background: #111;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body { position: relative; }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #home-screen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(10,10,10,0.88);
      z-index: 10;
    }
    .panel {
      width: min(560px, 86vw);
      padding: 32px 24px;
      border: 2px solid rgba(255,255,255,0.24);
      background: rgba(18,18,18,0.82);
      box-shadow: 0 0 32px rgba(0,0,0,0.7);
      text-align: center;
      color: #fff;
    }
    .panel h1 {
      margin: 0 0 18px;
      font-size: clamp(36px, 5vw, 58px);
      letter-spacing: 4px;
      color: #f4e7a5;
      text-shadow: 0 0 18px rgba(255,230,120,0.3);
    }
    .panel p {
      margin: 12px 0;
      color: #d9d9d9;
      line-height: 1.8;
      font-size: 14px;
    }
    .start-button {
      margin-top: 18px;
      background: #d4b95a;
      color: #111;
      border: 0;
      padding: 14px 30px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 2px;
    }
    .start-button:hover { background: #f0d878; }

    #ui-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #crosshair {
      position: absolute;
      top: 50%; left: 50%;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.8);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.8);
    }
    #crosshair::before {
      left: 50%; top: -6px; width: 2px; height: 30px; transform: translateX(-50%);
    }
    #crosshair::after {
      top: 50%; left: -6px; width: 30px; height: 2px; transform: translateY(-50%);
    }

    #goal {
      position: absolute;
      top: 24px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.45);
      color: #fff;
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 10px;
      letter-spacing: 2px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    #message {
      position: absolute;
      left: 50%; bottom: 28px;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 14px;
      padding: 10px 18px;
      border-radius: 10px;
      display: none;
      letter-spacing: 1px;
    }
    #message.show { display: block; }
  </style>
</head>
<body>
  <div id="home-screen">
    <div class="panel">
      <h1>ESCAPE</h1>
      <p>黄色い廊下の奥にある出口を見つけて脱出しろ。<br>壁にぶつかると進めない。部屋は終わらない。</p>
      <p>WASD / 矢印キー: 移動<br>マウス: 視点操作<br>Space: ジャンプ</p>
      <button class="start-button" id="start-button">ENTER</button>
    </div>
  </div>

  <div id="ui-layer">
    <div id="crosshair"></div>
    <div id="goal">GOAL: EXIT DOOR</div>
    <div id="message">EXIT FOUND</div>
  </div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

    const homeScreen = document.getElementById('home-screen');
    const startButton = document.getElementById('start-button');
    const message = document.getElementById('message');

    let started = false;
    let yaw = 0;
    let pitch = 0;
    let moveF = 0;
    let moveR = 0;
    let jumpVel = 0;
    let grounded = true;
    let cleared = false;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x404f36);
    scene.fog = new THREE.Fog(0x404f36, 18, 100);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xb9c7af, 0x241d1a, 1.2);
    scene.add(hemi);

    const flashlight = new THREE.SpotLight(0xf5f1c7, 4.8, 40, Math.PI / 7, 0.75, 1.2);
    flashlight.position.set(0, 1.4, 0);
    flashlight.target.position.set(0, 0, -8);
    scene.add(flashlight);
    scene.add(flashlight.target);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(160, 160),
      new THREE.MeshStandardMaterial({ color: 0x8b8a4c, roughness: 0.95 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const ceiling = new THREE.Mesh(
      new THREE.PlaneGeometry(160, 160),
      new THREE.MeshStandardMaterial({ color: 0xd7d08f, roughness: 0.9 })
    );
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.y = 4.5;
    scene.add(ceiling);

    const wallMat = new THREE.MeshStandardMaterial({ color: 0x687b4f, roughness: 0.98 });
    const colliders = [];

    function addWall(x, z, w, d, h = 4.5) {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
      wall.position.set(x, h / 2, z);
      scene.add(wall);
      colliders.push({
        minX: x - w / 2,
        maxX: x + w / 2,
        minZ: z - d / 2,
        maxZ: z + d / 2,
      });
    }

    // メインの廊下
    for (let i = -65; i <= 65; i += 12) {
      if (Math.abs(i) >= 12) {
        addWall(-20, i, 1.5, 10);
        addWall(20, i, 1.5, 10);
      }
    }

    addWall(0, -74, 38, 2);
    addWall(0, 74, 38, 2);
    addWall(-25, 0, 2, 150);
    addWall(25, 0, 2, 150);

    // maze-like little dead ends
    addWall(-8, -24, 1.5, 12);
    addWall(8, -24, 1.5, 12);
    addWall(-8, 24, 1.5, 12);
    addWall(8, 24, 1.5, 12);

    const exitGroup = new THREE.Group();
    const doorFrame = new THREE.Mesh(
      new THREE.BoxGeometry(4.2, 4.2, 0.8),
      new THREE.MeshStandardMaterial({ color: 0x8b6f3f, roughness: 0.8 })
    );
    doorFrame.position.set(0, 2.1, -68);
    exitGroup.add(doorFrame);

    const door = new THREE.Mesh(
      new THREE.BoxGeometry(2.8, 3.4, 0.3),
      new THREE.MeshStandardMaterial({ color: 0x5f3b2d, roughness: 0.7 })
    );
    door.position.set(0, 1.7, -67.5);
    exitGroup.add(door);

    const doorLight = new THREE.PointLight(0xffdd88, 2, 18, 2);
    doorLight.position.set(0, 2.5, -66.2);
    exitGroup.add(doorLight);

    scene.add(exitGroup);

    const playerPos = new THREE.Vector3(0, 1.5, 58);

    function checkCollision(x, z, radius = 0.8) {
      for (const c of colliders) {
        const closestX = Math.max(c.minX, Math.min(x, c.maxX));
        const closestZ = Math.max(c.minZ, Math.min(z, c.maxZ));
        const dx = x - closestX;
        const dz = z - closestZ;
        if (dx * dx + dz * dz < radius * radius) {
          return true;
        }
      }
      return false;
    }

    startButton.addEventListener('click', () => {
      homeScreen.style.display = 'none';
      started = true;
      if (document.body.requestPointerLock) {
        document.body.requestPointerLock();
      }
    });

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') moveF = 1;
      if (k === 's' || k === 'arrowdown') moveF = -1;
      if (k === 'a' || k === 'arrowleft') moveR = -1;
      if (k === 'd' || k === 'arrowright') moveR = 1;
      if (k === ' ' && grounded) {
        jumpVel = 0.45;
        grounded = false;
      }
      if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) {
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') moveF = 0;
      if (k === 's' || k === 'arrowdown') moveF = 0;
      if (k === 'a' || k === 'arrowleft') moveR = 0;
      if (k === 'd' || k === 'arrowright') moveR = 0;
    });

    document.addEventListener('mousemove', (e) => {
      if (started && document.pointerLockElement === document.body && !cleared) {
        yaw -= e.movementX * 0.0036;
        pitch = Math.max(-1.4, Math.min(1.4, pitch - e.movementY * 0.0036));
      }
    });

    function animate() {
      requestAnimationFrame(animate);

      if (started && !cleared) {
        const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)).normalize();
        const right = new THREE.Vector3(forward.z, 0, -forward.x).normalize();

        const move = new THREE.Vector3();
        move.addScaledVector(forward, moveF);
        move.addScaledVector(right, moveR);

        if (move.lengthSq() > 0) {
          move.normalize().multiplyScalar(0.15);
          const nx = playerPos.x + move.x;
          const nz = playerPos.z + move.z;
          if (!checkCollision(nx, playerPos.z)) playerPos.x = nx;
          if (!checkCollision(playerPos.x, nz)) playerPos.z = nz;
        }

        playerPos.y += jumpVel;
        jumpVel -= 0.012;
        if (playerPos.y <= 1.5) {
          playerPos.y = 1.5;
          jumpVel = 0;
          grounded = true;
        }
      }

      camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
      camera.position.copy(playerPos);
      flashlight.position.copy(camera.position);
      flashlight.position.y += 0.2;
      flashlight.target.position.copy(camera.position)
        .add(new THREE.Vector3(Math.sin(yaw), Math.sin(pitch) * 0.6, Math.cos(yaw)).multiplyScalar(10));

      if (!cleared && playerPos.distanceTo(new THREE.Vector3(0, 1.5, -68)) < 3.5) {
        cleared = true;
        message.textContent = 'EXIT FOUND - ESCAPED';
        message.classList.add('show');
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    camera.position.copy(playerPos);
    animate();
  </script>
</body>
</html>
